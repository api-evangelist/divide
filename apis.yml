name: Divide *
description: 'Divide was a bring-your-own-device (BYOD) mobile management product, built by Enterproid,
  that created a secure, separate work persona (dual-persona / work profile) on an employee''s personal
  Android and iOS phone. Backed by GV (Google Ventures), the company was acquired by Google on May 19,
  2014 and folded into the Android for Work / Android Enterprise program. The standalone Divide product
  and any developer or API surface have been discontinued; divide.com now serves a Google-owned tombstone
  page that redirects visitors to android.com/work. No independent API, developer portal, SDK, or
  specification remains to enrich — this record is preserved as an acquired-company profile.'
